name: Remote Terminal

on:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Start tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true   # only your GitHub account can connect
