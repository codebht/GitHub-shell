name: Remote Terminal

on:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Setup SSH server
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKMkjybladVbmzO11AnCl1wwXt/QvBdssWNA2z1urzsJ u0_a439@localhost" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          sudo /usr/sbin/sshd

      - name: Open tunnel
        run: |
          curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz" | tar xz
          ./bore local 22 --to bore.pub